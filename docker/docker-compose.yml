services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost}
      DB_ENGINE: ${DB_ENGINE:-postgresql}
      POSTGRES_DB: ${POSTGRES_DB:-bidding_db}
      POSTGRES_USER: ${POSTGRES_USER:-bidding_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bidding_pass}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn universal_bidding.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_ENGINE: ${DB_ENGINE:-postgresql}
      POSTGRES_DB: ${POSTGRES_DB:-bidding_db}
      POSTGRES_USER: ${POSTGRES_USER:-bidding_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bidding_pass}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: celery -A universal_bidding worker --loglevel=info
    volumes:
      - media_data:/app/media
    depends_on:
      - db
      - redis

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_ENGINE: ${DB_ENGINE:-postgresql}
      POSTGRES_DB: ${POSTGRES_DB:-bidding_db}
      POSTGRES_USER: ${POSTGRES_USER:-bidding_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bidding_pass}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: celery -A universal_bidding beat --loglevel=info
    volumes:
      - media_data:/app/media
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bidding_db}
      POSTGRES_USER: ${POSTGRES_USER:-bidding_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bidding_pass}

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
  media_data:
  static_data:
